# The owner performs the FIRST publish manually with browser/security-key authentication.
# Every package trusts this file; see .github/PACKAGE-RELEASES.md for first-publish setup.
---
name: Publish
"on":
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.release.outputs.packages }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roundtable_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROUNDTABLE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/roundtable_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true
      # v4.4.0 caches only when `cache:` is set, and `package-manager-cache` does not exist yet.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Install native canvas prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config
          libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      # Trusted publishing needs a newer npm than the runner's.
      - run: npm install --global npm@latest # zizmor: ignore[adhoc-packages]
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run check:packages
      - name: Run the opt-in sandbox Docker integration on native Linux
        working-directory: packages/sandbox
        env:
          SANDBOX_DOCKER_TEST: "1"
        run: |
          [[ "$SANDBOX_DOCKER_TEST" == 1 ]]
          [[ "$(uname -s)" == Linux ]]
          [[ "$(id -u)" != 0 ]]
          bun test src/docker.integration.test.ts
      - name: Pack every workspace and require its manual first npm publication
        run: bun scripts/preflight-release.ts "$GITHUB_REF_NAME"
      - name: Scan all packages for private content
        run: bun scripts/scan-public.ts .
      - name: Check lockstep release versions and peer ranges
        id: release
        run: bun scripts/check-release.ts "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - run: npm publish --provenance --access public
  packages:
    needs: publish
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.publish.outputs.packages) }}
    name: Publish ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Install native canvas prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config
          libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      - run: npm install --global npm@latest # zizmor: ignore[adhoc-packages]
      - name: Build and pack on this publishing runner too
        run: npm pack --dry-run --json
        working-directory: ${{ matrix.path }}
      - name: Scan this runner's built bundle
        run: bun scripts/scan-public.ts .
      - run: npm publish --provenance --access public
        working-directory: ${{ matrix.path }}
