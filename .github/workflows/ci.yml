---
name: CI
"on":
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roundtable_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROUNDTABLE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/roundtable_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: Scan the tree for private names, addresses, IDs, and credentials
        run: bun scripts/scan-public.ts .
      - run: bun install
      - run: bun run typecheck
      - run: bun run lint
      - name: Require PostgreSQL-backed tests
        run: test -n "$ROUNDTABLE_TEST_DATABASE_URL"
      - run: bun test
