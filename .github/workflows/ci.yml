---
name: CI
"on":
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roundtable_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROUNDTABLE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/roundtable_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Scan the tree for private names, addresses, IDs, and credentials
        run: bun scripts/scan-public.ts .
      - name: Install native canvas prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config
          libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run --workspaces typecheck
      - run: bun run lint
      - run: bun run --workspaces lint
      - name: Require PostgreSQL-backed tests
        run: test -n "$ROUNDTABLE_TEST_DATABASE_URL"
      - run: bun run test
      - run: bun run --workspaces --sequential test
      - name: Run the opt-in sandbox Docker integration on native Linux
        working-directory: packages/sandbox
        env:
          SANDBOX_DOCKER_TEST: "1"
        run: |
          [[ "$SANDBOX_DOCKER_TEST" == 1 ]]
          [[ "$(uname -s)" == Linux ]]
          [[ "$(id -u)" != 0 ]]
          bun test src/docker.integration.test.ts
      - name: Pack every workspace without requiring unpublished packages on npm
        run: bun scripts/preflight-release.ts "v$(node -p 'require("./package.json").version')" --local
      - name: Scan the built bundles too
        run: bun scripts/scan-public.ts .
  # pi is a range dependency, so a pi-core bump only moves the lockfile and needs no release.
  # Merge it once the checks pass; a major bump crosses the range and stays for review.
  automerge-pi:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: >-
          steps.metadata.outputs.dependency-group == 'pi-core' &&
          steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash "$PR_URL"
