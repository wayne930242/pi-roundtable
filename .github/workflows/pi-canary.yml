---
# The package accepts any pi release from 0.99.2 below 2.0, so a new pi can break it before anyone bumps the lockfile.
# This job installs the newest allowed pi every day and runs the full checks against it.
name: Pi canary
"on":
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roundtable_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROUNDTABLE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/roundtable_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/install
        with:
          frozen: "false"
          cache: true
      - name: Move pi to the newest release the range allows
        run: bun update @earendil-works/pi-coding-agent @earendil-works/pi-ai
      # The sandbox package pins pi exactly for its own checks, so it keeps a nested, older pi whose
      # types do not match the root's. Drop that nested copy so it resolves the root's newer pi.
      # Re-pinning and reinstalling instead relinks its pi-roundtable to the package itself.
      - name: Let the sandbox package use the root's pi
        run: rm -rf packages/sandbox/node_modules/@earendil-works
      - name: Show the pi versions under test
        run: bun pm ls --all 2>&1 | grep -E '@earendil-works/pi-(coding-agent|ai)@'
      - run: bun run typecheck
      - run: bun run lint
      - name: Require PostgreSQL-backed tests
        run: test -n "$ROUNDTABLE_TEST_DATABASE_URL"
      - run: bun run test
      - run: bun run check:packages
