---
# The package accepts any pi release from 0.99.2 below 2.0, so a new pi can break it before anyone bumps the lockfile.
# This job installs the newest allowed pi every day and runs the full checks against it.
name: Pi canary
"on":
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roundtable_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROUNDTABLE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/roundtable_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install native canvas prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config
          libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - run: bun install
      - name: Move pi to the newest release the range allows
        run: bun update @earendil-works/pi-coding-agent @earendil-works/pi-ai
      - name: Show the pi versions under test
        run: bun pm ls 2>&1 | grep -E '@earendil-works/pi-(coding-agent|ai)@'
      - run: bun run typecheck
      - run: bun run lint
      - name: Require PostgreSQL-backed tests
        run: test -n "$ROUNDTABLE_TEST_DATABASE_URL"
      - run: bun run test
      - run: bun run check:packages
